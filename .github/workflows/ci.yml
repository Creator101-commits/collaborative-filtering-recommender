name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - run: uv sync --locked
      - run: uv run recommender --help
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
